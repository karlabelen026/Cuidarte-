<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1F3864"/></marker>
  </defs>
  <rect width="1000" height="380" fill="#FFFFFF"/>
  <text x="500" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#000">Figura 2. Flujo de una petición y controles de seguridad en el código de Cuidarte+</text>
  <g font-size="14" fill="#000">
    <!-- 1 -->
    <rect x="20" y="60" width="150" height="110" rx="8" fill="#FBE5D6" stroke="#C00000" stroke-width="2.5"/>
    <text x="95" y="88" text-anchor="middle" font-weight="bold">Web y nginx</text>
    <text x="95" y="108" text-anchor="middle" font-size="12">Solo gzip y caché</text>
    <text x="95" y="124" text-anchor="middle" font-size="12">Sin CSP ni cabeceras</text>
    <text x="95" y="150" text-anchor="middle" font-size="12" fill="#C00000">Brecha: nginx.conf</text>
    <!-- 2 -->
    <rect x="205" y="60" width="150" height="110" rx="8" fill="#FBE5D6" stroke="#C00000" stroke-width="2.5"/>
    <text x="280" y="88" text-anchor="middle" font-weight="bold">Express y CORS</text>
    <text x="280" y="108" text-anchor="middle" font-size="12">cors() sin origen</text>
    <text x="280" y="124" text-anchor="middle" font-size="12">Sin helmet ni límite</text>
    <text x="280" y="150" text-anchor="middle" font-size="12" fill="#C00000">Brecha: app.js</text>
    <!-- 3 -->
    <rect x="390" y="60" width="150" height="110" rx="8" fill="#E2F0D9" stroke="#375623" stroke-width="2"/>
    <text x="465" y="88" text-anchor="middle" font-weight="bold">Validación</text>
    <text x="465" y="108" text-anchor="middle" font-size="12">yup: validate()</text>
    <text x="465" y="124" text-anchor="middle" font-size="12">400 con detalle</text>
    <text x="465" y="150" text-anchor="middle" font-size="12" fill="#375623">Control presente</text>
    <!-- 4 -->
    <rect x="575" y="60" width="150" height="110" rx="8" fill="#FFF2CC" stroke="#BF9000" stroke-width="2.5"/>
    <text x="650" y="88" text-anchor="middle" font-weight="bold">Verificación JWT</text>
    <text x="650" y="108" text-anchor="middle" font-size="12">jwt.verify(token)</text>
    <text x="650" y="124" text-anchor="middle" font-size="12">Secreto de respaldo</text>
    <text x="650" y="150" text-anchor="middle" font-size="12" fill="#7F6000">Parcial: "inseguro"</text>
    <!-- 5 -->
    <rect x="760" y="60" width="220" height="110" rx="8" fill="#FFF2CC" stroke="#BF9000" stroke-width="2.5"/>
    <text x="870" y="88" text-anchor="middle" font-weight="bold">requireRole</text>
    <text x="870" y="108" text-anchor="middle" font-size="12">Solo en POST, PUT y DELETE</text>
    <text x="870" y="124" text-anchor="middle" font-size="12">de examenes, documentos, pacientes</text>
    <text x="870" y="150" text-anchor="middle" font-size="12" fill="#7F6000">Parcial: lecturas sin rol</text>
  </g>
  <!-- flechas superiores -->
  <g stroke="#1F3864" stroke-width="2" marker-end="url(#arr2)">
    <line x1="172" y1="115" x2="203" y2="115"/>
    <line x1="357" y1="115" x2="388" y2="115"/>
    <line x1="542" y1="115" x2="573" y2="115"/>
    <line x1="727" y1="115" x2="758" y2="115"/>
  </g>
  <!-- Filas de hallazgos -->
  <rect x="20" y="200" width="960" height="160" rx="8" fill="#F2F2F2" stroke="#7F7F7F" stroke-width="1.5"/>
  <text x="40" y="228" font-size="15" font-weight="bold" fill="#000">Rutas sin control de rol verificado en el código</text>
  <g font-size="13" fill="#000">
    <text x="40" y="256">• GET /pacientes/:id, PUT /pacientes/:id y GET /pacientes/buscar/rut/:rut (la última se declara "pública")</text>
    <text x="40" y="278">• GET /examenes, GET /examenes/:id, GET /examenes/paciente/:id y GET /documentos/:id, /documentos/examen/:id</text>
    <text x="40" y="300">• DELETE /usuarios/:id y DELETE /roles/:id: no llaman a requireRole ni validan token antes de borrar</text>
    <text x="40" y="322">• Contraseñas en texto plano: auth.js compara user.contrasena !== password e inserta sin cifrar</text>
    <text x="40" y="344">• El error 500 devuelve error.message (validate.js y users.js), lo que filtra detalles internos</text>
  </g>
  <rect x="20" y="180" width="0" height="0"/>
  <text x="20" y="372" font-size="11" fill="#444">Rojo: brecha sin control. Amarillo: control parcial. Verde: control presente. Fuente: revisión manual de BACKEND/src y FRONTEND/nginx.conf (solo lectura).</text>
</svg>
