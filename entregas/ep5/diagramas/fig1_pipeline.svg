<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1F3864"/></marker>
  </defs>
  <rect width="1000" height="300" fill="#FFFFFF"/>
  <text x="500" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#000">Figura 1. Pipeline de seguridad automatizada de Cuidarte+</text>
  <!-- Etapas -->
  <g font-size="14" fill="#000">
    <rect x="20" y="70" width="150" height="120" rx="8" fill="#D9E2F3" stroke="#1F3864" stroke-width="2"/>
    <text x="95" y="100" text-anchor="middle" font-weight="bold">1. Análisis estático</text>
    <text x="95" y="122" text-anchor="middle">Semgrep 1.95.0</text>
    <text x="95" y="140" text-anchor="middle">ESLint · npm audit</text>
    <text x="95" y="170" text-anchor="middle" font-size="12" fill="#444">Entrada: código fuente</text>

    <rect x="205" y="70" width="150" height="120" rx="8" fill="#D9E2F3" stroke="#1F3864" stroke-width="2"/>
    <text x="280" y="100" text-anchor="middle" font-weight="bold">2. Despliegue</text>
    <text x="280" y="122" text-anchor="middle">docker compose</text>
    <text x="280" y="140" text-anchor="middle">up -d --build</text>
    <text x="280" y="170" text-anchor="middle" font-size="12" fill="#444">API :4444 · Web :3333</text>

    <rect x="390" y="70" width="150" height="120" rx="8" fill="#D9E2F3" stroke="#1F3864" stroke-width="2"/>
    <text x="465" y="100" text-anchor="middle" font-weight="bold">3. Funcionales</text>
    <text x="465" y="122" text-anchor="middle">Newman (API)</text>
    <text x="465" y="140" text-anchor="middle">Katalon Recorder</text>
    <text x="465" y="170" text-anchor="middle" font-size="12" fill="#444">Aserciones por caso</text>

    <rect x="575" y="70" width="150" height="120" rx="8" fill="#D9E2F3" stroke="#1F3864" stroke-width="2"/>
    <text x="650" y="100" text-anchor="middle" font-weight="bold">4. Escaneo dinámico</text>
    <text x="650" y="122" text-anchor="middle">OWASP ZAP</text>
    <text x="650" y="140" text-anchor="middle">modo baseline</text>
    <text x="650" y="170" text-anchor="middle" font-size="12" fill="#444">Cabeceras y configuración</text>

    <rect x="760" y="70" width="110" height="120" rx="8" fill="#D9E2F3" stroke="#1F3864" stroke-width="2"/>
    <text x="815" y="100" text-anchor="middle" font-weight="bold">5. Carga</text>
    <text x="815" y="122" text-anchor="middle">JMeter</text>
    <text x="815" y="140" text-anchor="middle">NF-01 a NF-03</text>
    <text x="815" y="170" text-anchor="middle" font-size="12" fill="#444">p. ej. latencia &lt; 2 s</text>
  </g>
  <!-- Flechas -->
  <g stroke="#1F3864" stroke-width="2" marker-end="url(#arr)">
    <line x1="172" y1="130" x2="203" y2="130"/>
    <line x1="357" y1="130" x2="388" y2="130"/>
    <line x1="542" y1="130" x2="573" y2="130"/>
    <line x1="727" y1="130" x2="758" y2="130"/>
  </g>
  <!-- Compuerta -->
  <rect x="20" y="215" width="950" height="62" rx="8" fill="#FBE5D6" stroke="#C55A11" stroke-width="2"/>
  <text x="495" y="242" text-anchor="middle" font-size="14" font-weight="bold" fill="#000">Compuerta de decisión</text>
  <text x="495" y="264" text-anchor="middle" font-size="13" fill="#000">Hallazgo crítico en 1 o 4, o caso fallido en 3 o 5: se bloquea la integración. Umbrales: error ≤ 5 %, latencia promedio &lt; 2 s (sección 3.3)</text>
  <line x1="815" y1="190" x2="815" y2="213" stroke="#C55A11" stroke-width="2" marker-end="url(#arr)"/>
</svg>
